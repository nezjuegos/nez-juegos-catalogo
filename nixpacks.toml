providers = ["python"]

[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libatspi2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2t64",
  "libwayland-client0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxext6",
  "libxrender1",
  "libxtst6",
  "libglib2.0-0",
  "ca-certificates",
  "fonts-liberation"
]

[phases.install]
# "..." runs Nixpacks default Python setup (creates venv + installs pip + requirements.txt)
cmds = [
  "...",
  "python -m pip install --upgrade pip",
  "python -m playwright install chromium"
]
