<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Checkout Nintendo | Nez Juegos</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
    :root{
      --bg:#0a0a0c;--card:#131318;--primary:#8b5cf6;--secondary:#d946ef;
      --text:#f8fafc;--muted:#94a3b8;--border:#27272a;--wa:#25D366;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{background:var(--bg);color:var(--text)}
    .container{max-width:780px;margin:0 auto;padding:1.5rem}
    
    .back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);text-decoration:none;margin-bottom:1.1rem;font-weight:500}
    
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.4rem;margin-bottom:1rem}
    
    .head{display:grid;grid-template-columns:160px 1fr;gap:1.25rem;align-items:center}
    .cover{width:100%;height:135px;object-fit:cover;border-radius:12px;border:1px solid var(--border);background:#111}
    
    .title{font-family:'Outfit';font-size:1.65rem;line-height:1.2;margin-bottom:.25rem}
    
    .mode{border:2px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.75rem;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.015)}
    .mode:hover{border-color:rgba(139,92,246,.35)}
    .mode.sel{border-color:var(--primary);background:rgba(139,92,246,.08)}
    .mode h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#c4b5fd;margin-bottom:.4rem}
    .mode .chip{display:inline-block;font-size:.68rem;padding:.12rem .5rem;border-radius:999px;background:rgba(139,92,246,.15);color:#c4b5fd;margin-bottom:.3rem}
    
    .price{display:flex;gap:.45rem;align-items:baseline;margin-bottom:.4rem}
    .old{color:var(--muted);text-decoration:line-through}
    .new{font-family:'Outfit';font-size:1.35rem;font-weight:900;color:var(--yellow,#facc15)}
    
    .desc{font-size:.88rem;color:var(--muted);line-height:1.5}
    .warn{font-size:.78rem;color:#fca5a5;margin-top:.4rem}
    
    .summary{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;margin-bottom:.9rem;font-size:.92rem;color:var(--muted)}
    .summary strong{color:#fff}
    
    .btn-wa{
      display:flex;align-items:center;justify-content:center;gap:.6rem;
      width:100%;padding:.85rem 1.2rem;border:none;border-radius:999px;
      background:#25D366;color:white;font-weight:800;font-size:1.05rem;
      text-decoration:none;box-shadow:0 4px 15px rgba(37,211,102,.35);
      transition:.2s;
    }
    .btn-wa:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .btn-wa svg{width:22px;height:22px}
    
    .muted{color:var(--muted);font-size:.84rem}
    
    @media (max-width:760px){
      .head{grid-template-columns:1fr}
      .cover{height:180px}
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back" href="javascript:history.back()">← Volver</a>
    <div class="card head">
      <img id="cover" class="cover" alt="">
      <div>
        <h1 id="title" class="title">Cargando...</h1>
        <p class="muted">Elegí una modalidad para continuar.</p>
      </div>
    </div>

    <div class="card">
      <div id="modePrimaria" class="mode" onclick="selectMode('primaria')"></div>
      <div id="modeCodigo" class="mode" style="margin-top:.65rem;" onclick="selectMode('codigo')"></div>
      <div id="summary" class="summary"></div>
      <a id="buyBtn" class="btn-wa" href="#">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
        Comprar
      </a>
    </div>
  </main>
  <script>
    const ars = (v) => v ? '$' + Number(v).toLocaleString('es-AR') : 'Consultar';
    const esc = (s) => String(s || '').replace(/[&<"]/g, m => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[m]));
    const slug = new URLSearchParams(location.search).get('game');
    let item = null;
    let selected = 'primaria';

    const priceLine = (reg, off) => {
      const same = Number(reg || 0) === Number(off || 0) || !reg;
      if (same) return `<span class="new">${ars(off)}</span>`;
      return `<span class="old">${ars(reg)}</span><span class="new">${ars(off)}</span>`;
    };

    function renderMode(el, mode){
      const m = item[mode];
      el.innerHTML = `
        <span class="chip">${mode === 'codigo' ? 'Canjeable' : 'Cuenta'}</span>
        <h3>${esc(m.label)}</h3>
        <div class="price">${priceLine(m.regular_price_ars, m.offer_price_ars)}</div>
        <p class="desc">${esc(m.description)}</p>
        ${mode === 'codigo' ? `<p class="warn">${esc(m.disclaimer || '')}</p>` : ''}
      `;
    }
    function selectMode(mode){
      selected = mode;
      document.getElementById('modeCodigo').classList.toggle('sel', mode === 'codigo');
      document.getElementById('modePrimaria').classList.toggle('sel', mode === 'primaria');
      const price = mode === 'codigo' ? item.codigo.offer_price_ars : item.primaria.offer_price_ars;
      const txt = mode === 'codigo' ? 'Código Digital (Japón)' : 'Cuenta Primaria Permanente';
      const waMsg = encodeURIComponent(`Hola! Quiero comprar ${item.title}\nModalidad: ${txt}\nPrecio: ${ars(price)}`);
      document.getElementById('buyBtn').href = `https://wa.me/5491160120337?text=${waMsg}`;
      document.getElementById('buyBtn').innerHTML = `
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
        Comprar
      `;
      const summary = document.getElementById('summary');
      if (summary) summary.innerHTML = `Modalidad seleccionada: <strong>${txt}</strong><br>Total: <strong>${ars(price)}</strong>`;
    }

    async function load(){
      if (!slug) { document.getElementById('title').textContent = 'Checkout inválido'; return; }
      const r = await fetch(`/api/nintendo-mirror-item/${encodeURIComponent(slug)}`);
      const d = await r.json();
      if (!r.ok || !d.item) { document.getElementById('title').textContent = 'Juego no encontrado'; return; }
      item = d.item;
      document.title = `Checkout | ${item.title}`;
      document.getElementById('title').textContent = item.title;
      const cover = document.getElementById('cover');
      cover.src = item.image_url || '';
      cover.onerror = () => { cover.style.display = 'none'; };
      renderMode(document.getElementById('modeCodigo'), 'codigo');
      renderMode(document.getElementById('modePrimaria'), 'primaria');
      selectMode('primaria');
    }
    load().catch(() => { document.getElementById('title').textContent = 'Error cargando checkout'; });
  </script>
</body>
</html>
