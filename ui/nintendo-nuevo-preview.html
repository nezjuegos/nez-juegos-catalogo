<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Switch | Nez Juegos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0a0c; --card:#131318; --primary:#8b5cf6; --secondary:#d946ef; --text:#f8fafc; --muted:#94a3b8; --border:#27272a; --yellow:#facc15; }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:var(--bg);color:var(--text)}
        a{text-decoration:none;color:inherit}
        header{position:sticky;top:0;background:rgba(10,10,12,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:10}
        .logo{font-family:'Outfit';font-weight:800;font-size:1.45rem}
        .logo span{background:linear-gradient(to right,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
        .nav-links{display:flex;gap:1.4rem}
        .nav-links a{font-weight:500;color:var(--muted);transition:.2s}
        .nav-links a:hover,.nav-links a.active{color:#fff}
        .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;padding:8px;border:none;background:none;border-radius:8px}
        .hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
        .mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(13,13,18,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);z-index:1050;flex-direction:column;padding:1rem 1.25rem}
        .mobile-menu.open{display:flex}
        .mobile-menu a{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--muted);font-weight:600}
        .mobile-menu a:last-child{border-bottom:none}
        .container{max-width:1320px;margin:0 auto;padding:1.2rem}
        .catalog-brand{width:100%;max-width:560px;height:170px;object-fit:cover;border-radius:14px;border:1px solid var(--border);margin-bottom:.9rem;background:#111}
        .platform-link{display:inline-block;margin:0 0 1rem;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:.55rem .95rem;border-radius:999px;font-size:.88rem;font-weight:700;text-decoration:none}
        .platform-link:hover{border-color:rgba(139,92,246,.5)}
        .search{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem}
        .search input{width:100%;border:none;background:transparent;color:#fff;font-size:1rem;outline:none}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;min-height:292px}
        .card:hover{transform:translateY(-4px);border-color:rgba(217,70,239,.4)}
        .cover{height:135px;width:100%;object-fit:cover;background:#111}
        .body{padding:.72rem .82rem .55rem;display:flex;flex-direction:column;gap:.45rem}
        .title{font-family:'Outfit';font-weight:800;line-height:1.2;font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .title.long{font-size:.92rem}
        .title.xlong{font-size:.84rem}
        .prices{display:flex;flex-direction:column;gap:.28rem}
        .price-row{display:flex;justify-content:space-between;align-items:center;padding:.26rem 0;border-top:1px solid rgba(255,255,255,.05)}
        .price-row:first-child{border-top:none}
        .price-name{font-size:.72rem;color:var(--muted);font-weight:600}
        .price-values{display:flex;align-items:baseline;gap:.38rem}
        .price-old{font-size:.74rem;color:var(--muted);text-decoration:line-through}
        .price-new{font-family:'Outfit';font-size:.96rem;font-weight:800;color:#facc15}
        .cta{padding:.65rem .82rem}
        .btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:.52rem .6rem;border-radius:999px;font-size:.78rem;font-weight:700}
        .muted{color:var(--muted);font-size:.82rem}
        @media (max-width: 768px){
            header{padding:.8rem 1rem}
            .nav-links{display:none}
            .hamburger{display:flex}
            .container{padding:.7rem}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
            .card{min-height:242px;border-radius:10px}
            .cover{height:96px}
            .body{padding:.5rem .55rem .35rem;gap:.28rem}
            .title{font-size:.86rem}
            .title.long{font-size:.8rem}
            .title.xlong{font-size:.75rem}
            .price-name{font-size:.66rem}
            .price-old{font-size:.68rem}
            .price-new{font-size:.86rem;color:#facc15}
            .cta{padding:.45rem .55rem}
            .btn{font-size:.72rem;padding:.45rem .5rem}
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="/">🎮 <span>Nez</span> Juegos</a></div>
        <nav class="nav-links">
            <a href="/playstation">PlayStation</a>
            <a href="/nintendo" class="active">Nintendo Switch</a>
            <a href="/packs">Packs</a>
            <a href="/terminos-y-condiciones">T&C</a>
        </nav>
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú"><span></span><span></span><span></span></button>
    </header>
    <div class="mobile-menu" id="mobileMenu">
        <a href="/">🏠 Inicio</a>
        <a href="/playstation">🎮 PlayStation</a>
        <a href="/nintendo">🔴 Nintendo Switch</a>
        <a href="/packs">📦 Packs</a>
        <a href="/terminos-y-condiciones">📄 T&C</a>
    </div>
    <main class="container">
        <img class="catalog-brand" src="https://imagenes.hobbyconsolas.com/files/image_1920_1080/uploads/imagenes/2023/04/25/6900c99e53bd9.jpeg" alt="Nintendo">
        <h1 style="font-family:'Outfit';font-size:1.8rem;margin-bottom:.25rem;">Nintendo Switch</h1>
        <p class="muted" style="margin-bottom:1rem;">Elegí el juego y revisá las modalidades disponibles.</p>
        <a class="platform-link" href="/playstation">🎮 Ver catálogo de PlayStation</a>
        <div class="search"><input id="q" type="text" placeholder="Buscar juego..."></div>
        <div id="grid" class="grid"></div>
    </main>
    <script>
        let allItems = [];
        const esc = (s) => String(s || '').replace(/[&<"]/g, m => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[m]));
        const ars = (v) => v ? '$' + Number(v).toLocaleString('es-AR') : 'Consultar';
        const priceValues = (reg, off) => {
            const same = Number(reg || 0) === Number(off || 0) || !reg;
            if (same) return `<span class="price-new">${ars(off)}</span>`;
            return `<span class="price-old">${ars(reg)}</span><span class="price-new">${ars(off)}</span>`;
        };
        function render(items){
            const grid = document.getElementById('grid');
            if (!items.length) { grid.innerHTML = '<p class="muted">No se encontraron juegos.</p>'; return; }
            grid.innerHTML = items.map(it => `
                <article class="card" onclick="goDetail('${encodeURIComponent(it.slug)}')">
                    <div style="cursor:pointer;">
                        <img class="cover" src="${esc(it.image_url || '')}" alt="" onerror="this.style.display='none'">
                        <div class="body">
                            <h3 class="title ${((it.title||'').length>46)?'xlong':((it.title||'').length>34?'long':'')}">${esc(it.title)}</h3>
                            <div class="prices">
                                <div class="price-row">
                                    <span class="price-name">Primaria</span>
                                    <span class="price-values">${priceValues(it.primaria?.regular_price_ars, it.primaria?.offer_price_ars)}</span>
                                </div>
                                <div class="price-row">
                                    <span class="price-name">Código</span>
                                    <span class="price-values">${priceValues(it.codigo?.regular_price_ars, it.codigo?.offer_price_ars)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cta"><a class="btn" href="/nintendo-checkout?game=${encodeURIComponent(it.slug)}" onclick="event.stopPropagation()">Comprar</a></div>
                </article>
            `).join('');
        }
        window.goDetail = function(slug){
            window.location.href = `/nintendo/${slug}`;
        };
        async function load(){
            const r = await fetch('/api/nintendo-mirror-catalog');
            const d = await r.json();
            allItems = d.results || [];
            render(allItems);
        }
        document.getElementById('q').addEventListener('input', (e) => {
            const q = (e.target.value || '').toLowerCase().trim();
            render(!q ? allItems : allItems.filter(x => (x.title || '').toLowerCase().includes(q)));
        });
        load().catch(() => { document.getElementById('grid').innerHTML = '<p class="muted">Error cargando catálogo.</p>'; });

        (function() {
            const btn = document.getElementById('hamburgerBtn');
            const menu = document.getElementById('mobileMenu');
            if (!btn || !menu) return;
            const close = () => menu.classList.remove('open');
            btn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('open'); });
            menu.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
            document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target !== btn) close(); });
        })();
    </script>
</body>
</html>
