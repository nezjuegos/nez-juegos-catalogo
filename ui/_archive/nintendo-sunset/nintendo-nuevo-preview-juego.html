<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego | Nintendo Switch</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0a0a0c; --card:#131318; --primary:#8b5cf6; --secondary:#d946ef;
            --text:#f8fafc; --muted:#94a3b8; --border:#27272a; --yellow:#facc15;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:var(--bg);color:var(--text)}
        a{text-decoration:none;color:inherit}
        header{position:sticky;top:0;background:rgba(10,10,12,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:10;display:flex;justify-content:space-between;align-items:center}
        .logo{font-family:'Outfit';font-weight:800;font-size:1.45rem}
        .logo span{background:linear-gradient(to right,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
        .nav-links{display:flex;gap:1.4rem}
        .nav-links a{font-weight:500;color:var(--muted);transition:.2s}
        .nav-links a:hover,.nav-links a.active{color:#fff}
        .hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;padding:8px;border:none;background:none;border-radius:8px}
        .hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
        .mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(13,13,18,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);z-index:1050;flex-direction:column;padding:1rem 1.25rem}
        .mobile-menu.open{display:flex}
        .mobile-menu a{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--muted);font-weight:600}
        .mobile-menu a:last-child{border-bottom:none}
        .container{max-width:1100px;margin:0 auto;padding:1.5rem}
        .back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);text-decoration:none;margin-bottom:1.2rem;font-weight:500}
        .back:hover{color:#fff}
        .game-layout{display:grid;grid-template-columns:380px 1fr;gap:2rem;align-items:start}
        .cover-card{position:sticky;top:90px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px}
        .cover{width:100%;height:380px;object-fit:cover;border-radius:14px;border:1px solid var(--border);background:#111}
        .info-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.75rem}
        .title{font-family:'Outfit';font-size:2.1rem;line-height:1.15;margin-bottom:.75rem}
        .mode{border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:1rem;background:rgba(255,255,255,.015);transition:.2s}
        .mode:hover{border-color:rgba(139,92,246,.4)}
        .mode h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#c4b5fd;margin-bottom:.45rem}
        .price{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
        .old{color:var(--muted);text-decoration:line-through;font-size:.95rem}
        .new{font-family:'Outfit';font-weight:900;color:var(--yellow);font-size:1.55rem}
        .desc{font-size:.9rem;color:var(--muted);line-height:1.5}
        .warn{margin-top:.45rem;font-size:.78rem;color:#fca5a5;line-height:1.4}
        .cta-wrap{display:flex;justify-content:center;margin-top:1.25rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-width:230px;gap:.5rem;text-decoration:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:.8rem 1.8rem;border-radius:999px;font-weight:800;font-size:.95rem;box-shadow:0 4px 15px rgba(139,92,246,.3)}
        .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
        @media (max-width:900px){
            header{padding:.8rem 1rem}
            .nav-links{display:none}
            .hamburger{display:flex}
            .game-layout{grid-template-columns:1fr;gap:1.5rem}
            .cover-card{position:static}
            .cover{height:260px}
            .title{font-size:1.65rem}
            .info-card{padding:1.35rem}
        }
    </style>
</head>

</html>
