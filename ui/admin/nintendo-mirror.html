<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Mirror | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#09090b; --card:#18181b; --text:#f8fafc; --muted:#a1a1aa; --border:#27272a; --primary:#8b5cf6; --ok:#22c55e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:var(--bg); color:var(--text); padding:1.2rem; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:1rem; }
        .btn { border:none; border-radius:8px; padding:.62rem .95rem; font-weight:700; cursor:pointer; }
        .btn-primary { background:var(--primary); color:white; }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); text-decoration:none; display:inline-block; }
        table { width:100%; border-collapse:collapse; }
        th, td { border-bottom:1px solid var(--border); padding:.62rem .45rem; text-align:left; vertical-align:middle; font-size:.86rem; }
        th { color:var(--muted); font-size:.73rem; text-transform:uppercase; }
        .thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#0b0b0f; }
        input[type="url"], input[type="file"] { width:100%; background:#0b0b0f; border:1px solid var(--border); color:#fff; border-radius:8px; padding:.56rem .65rem; }
        .muted { color:var(--muted); font-size:.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 style="font-family:'Outfit',sans-serif;">Nintendo Mirror (imagenes)</h1>
                <p class="muted">Configura foto final por item para la pagina privada: URL o archivo subido.</p>
            </div>
            <div style="display:flex; gap:.5rem;">
                <a href="/nintendo-nuevo-preview" target="_blank" class="btn btn-ghost">Abrir Preview</a>
                <a href="/admin" class="btn btn-ghost">Volver</a>
            </div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Juego</th>
                        <th>Imagen actual</th>
                        <th>URL imagen personalizada</th>
                        <th>Subir imagen</th>
                        <th>Accion</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script>
        let items = [];
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s || '').replace(/[&<"]/g, m => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[m]));

        async function load(){
            const r = await fetch('/api/admin/amazon-jp-tracker?include_inactive=1');
            const d = await r.json();
            items = (d.items || []).filter(i => i.is_active);
            render();
        }

        function rowImage(it){
            if (it.mirror_image_filename) return '/uploads/' + it.mirror_image_filename;
            if (it.mirror_image_url) return it.mirror_image_url;
            return it.image_url || '';
        }

        function render(){
            const tbody = $('tbody');
            tbody.innerHTML = items.map(it => `
                <tr>
                    <td>
                        <div style="font-weight:700;">${esc(it.display_name_es)}</div>
                        <div class="muted">ASIN ${esc(it.asin || '—')}</div>
                    </td>
                    <td>${rowImage(it) ? `<img class="thumb" src="${esc(rowImage(it))}" alt="">` : '<span class="muted">Sin imagen</span>'}</td>
                    <td><input type="url" id="url-${it.id}" value="${esc(it.mirror_image_url || '')}" placeholder="https://..."></td>
                    <td><input type="file" id="file-${it.id}" accept="image/*"></td>
                    <td><button class="btn btn-primary" onclick="save(${it.id})">Guardar</button></td>
                </tr>
            `).join('');
        }

        window.save = async function(id){
            const fd = new FormData();
            const url = document.getElementById(`url-${id}`).value.trim();
            const file = document.getElementById(`file-${id}`).files[0];
            fd.append('mirror_image_url', url);
            if (file) fd.append('image', file);
            const r = await fetch(`/api/admin/amazon-jp-tracker/${id}/mirror-image`, { method:'POST', body: fd });
            const d = await r.json();
            if (!r.ok) { alert(d.error || 'Error guardando imagen'); return; }
            await load();
            alert('Imagen actualizada');
        };

        load().catch(() => {});
    </script>
</body>
</html>
