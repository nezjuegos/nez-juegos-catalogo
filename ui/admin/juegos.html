<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Juegos | Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --primary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --ps-blue: #003087;
            --ps-light: #00439c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .header h1 { font-family: 'Outfit'; font-size: 2rem; }

        .btn { padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #7c3aed; }
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-back:hover { background: #27272a; color: white; }

        .layout { display: grid; grid-template-columns: 370px 1fr; gap: 2rem; }

        .form-section { background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }

        .form-group { margin-bottom: 1.2rem; }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; font-weight: 600; }

        input, select { width: 100%; background: #09090b; border: 1px solid var(--border); color: white; padding: 0.8rem; border-radius: 6px; }
        input:focus { outline: none; border-color: var(--primary); }

        /* Platform checkboxes */
        .platform-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .platform-check-item {
            display: flex; align-items: center; gap: 0.5rem;
            background: #09090b; border: 1px solid var(--border); border-radius: 6px;
            padding: 0.6rem 0.8rem; cursor: pointer; transition: 0.2s;
        }
        .platform-check-item:hover { border-color: var(--primary); background: rgba(139,92,246,0.05); }
        .platform-check-item input[type="checkbox"] { width: auto; accent-color: var(--primary); transform: scale(1.2); flex-shrink: 0; }
        .platform-check-item label { margin: 0; text-transform: none; font-size: 0.85rem; color: var(--text-main); cursor: pointer; font-weight: 500; }
        .platform-check-item.ps-item input[type="checkbox"] { accent-color: #4b8ef5; }
        .platform-check-item.ps-item label { color: #93c5fd; }

        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .tier-group div { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }

        /* eShop reference price - more prominent */
        .eshop-reference {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .eshop-reference label { margin: 0; color: #fca5a5; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        .eshop-reference input { background: transparent; border: none; border-bottom: 1px solid rgba(239,68,68,0.3); border-radius: 0; padding: 0.3rem 0; font-size: 1rem; font-weight: 700; color: #f87171; width: 100%; }
        .eshop-reference input::placeholder { color: rgba(248,113,113,0.4); font-size: 0.85rem; font-weight: 400; }
        .eshop-reference input:focus { outline: none; border-bottom-color: #ef4444; }

        /* File Upload */
        .file-upload { border: 2px dashed var(--border); padding: 2rem; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 1rem; }
        .file-upload:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }

        /* Table */
        .table-section { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #09090b; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .game-cell { display: flex; align-items: center; gap: 1rem; }
        .game-cell img { width: 80px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }

        .action-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.7; transition: 0.2s; margin-right: 0.5rem; }
        .action-btn:hover { opacity: 1; transform: scale(1.1); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .table-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .table-section table { min-width: 600px; }
            .header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            body { padding: 1rem; }
            .price-grid { grid-template-columns: 1fr !important; }
        }

        /* Toast */
        .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { background: #1e1e2e; color: white; padding: 0.9rem 1.5rem; border-radius: 8px; border-left: 4px solid #22c55e; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); font-size: 0.9rem; font-weight: 500; opacity: 0; transform: translateX(100%); animation: toastIn 0.3s ease forwards; }
        .toast.error { border-left-color: #ef4444; }
        .toast.fade-out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(100%); } }

        .section-divider { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0.4rem 0; border-top: 1px solid var(--border); margin-top: 0.5rem; margin-bottom: 0.25rem; }
    </style>
</head>

<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="header">
        <h1>🎮 Gestión de Juegos Individuales</h1>
        <a href="/admin" class="btn btn-back">Volver al Dashboard</a>
    </div>

    <div class="layout">
        <!-- Formulario (CRUD) -->
        <div class="form-section">
            <h2 id="formTitle" style="margin-bottom: 1.5rem; font-family: 'Outfit';">Agregar Nuevo Juego</h2>

            <input type="hidden" id="juegoId">

            <div class="form-group">
                <label>Título del Juego</label>
                <input type="text" id="titulo" placeholder="Ej: Mario Kart 8 Deluxe">
            </div>

            <div class="form-group">
                <label>Plataformas</label>
                <div class="platform-checks">
                    <div class="platform-check-item">
                        <input type="checkbox" id="plat_ns" value="Nintendo Switch">
                        <label for="plat_ns">🎎 Nintendo Switch</label>
                    </div>
                    <div class="platform-check-item">
                        <input type="checkbox" id="plat_ns2" value="Nintendo Switch 2">
                        <label for="plat_ns2">🎎 Nintendo Switch 2</label>
                    </div>
                    <div class="platform-check-item ps-item">
                        <input type="checkbox" id="plat_ps4" value="PS4">
                        <label for="plat_ps4">🎮 PlayStation 4</label>
                    </div>
                    <div class="platform-check-item ps-item">
                        <input type="checkbox" id="plat_ps5" value="PS5">
                        <label for="plat_ps5">🎮 PlayStation 5</label>
                    </div>
                </div>
                <!-- Hidden field that stores the comma-joined plataforma string -->
                <input type="hidden" id="plataforma">
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; background: rgba(234, 179, 8, 0.05); padding: 1rem; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.2);">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <input type="checkbox" id="is_featured"
                        style="width: auto; accent-color: #eab308; transform: scale(1.3);">
                    <label for="is_featured" style="margin-bottom: 0; cursor: pointer;">⭐ Juego Destacado</label>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;" title="1 sale primero. 0 sale al normal/al final.">
                    <label for="orden_destacado" style="margin-bottom: 0; font-size: 0.75rem; color: #eab308;">Orden:</label>
                    <input type="number" id="orden_destacado" placeholder="0"
                        style="width: 70px; padding: 0.4rem; text-align: center; margin: 0; font-size: 0.9rem; border-color: #eab308;">
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
                    <label style="margin: 0;">Precios (ARS)</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="number" id="global_discount" placeholder="% Desc"
                            style="width: 90px; padding: 0.4rem; font-size: 0.8rem;" min="1" max="99">
                        <button type="button" class="btn"
                            style="padding: 0.4rem 0.8rem; font-size: 0.8rem; background: #27272a; color: white;"
                            onclick="applyDiscount()">Aplicar</button>
                    </div>
                </div>

                <!-- Nintendo Price Fields -->
                <div id="priceFieldsNintendo" class="price-grid">
                    <div class="tier-group">
                        <div>Código Digital</div>
                        <input type="number" id="precio_codigo" placeholder="Regular (Ej: 115000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_codigo" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                    <div class="tier-group">
                        <div>Primaria</div>
                        <input type="number" id="precio_primaria" placeholder="Regular (Ej: 85000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_primaria" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                    <div class="tier-group">
                        <div>Secundaria</div>
                        <input type="number" id="precio_secundaria" placeholder="Regular (Ej: 45000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_secundaria" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                    <div class="tier-group">
                        <div>Alquiler 30 días</div>
                        <input type="number" id="precio_alquiler" placeholder="Regular (Ej: 18000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_alquiler" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                </div>

                <!-- PlayStation Price Fields -->
                <div id="priceFieldsPS" class="price-grid" style="display: none;">
                    <div class="tier-group">
                        <div>Primaria PS5</div>
                        <input type="number" id="precio_primaria_ps5" placeholder="Regular (Ej: 95000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_primaria_ps5" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                    <div class="tier-group">
                        <div>Primaria PS4</div>
                        <input type="number" id="precio_primaria_ps4" placeholder="Regular (Ej: 80000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_primaria_ps4" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                    <div class="tier-group" style="grid-column: 1 / -1;">
                        <div>Secundaria PS5</div>
                        <input type="number" id="precio_secundaria_ps5" placeholder="Regular (Ej: 50000)" style="margin-bottom: 6px;">
                        <input type="number" id="oferta_secundaria_ps5" placeholder="En Oferta" style="border-color: #eab308;">
                    </div>
                </div>

                <!-- Store reference price (prominent) -->
                <div class="eshop-reference" style="margin-top: 1rem;">
                    <label id="eshopLabel">eShop (Ref.)</label>
                    <input type="number" id="precio_eshop" placeholder="Precio tienda oficial con impuestos">
                </div>
            </div>

            <div class="form-group">
                <label>Portada (Horizontal 16:9)</label>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <div class="file-upload" id="dropZone">
                    <div id="previewContainer" style="display: none; margin-bottom: 1rem;">
                        <img id="imagePreview" style="max-width: 100%; border-radius: 4px; border: 1px solid var(--border);">
                    </div>
                    <span id="uploadText">📁 Haz clic para subir imagen</span>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 5px;">Se guardará localmente en el servidor</p>
                </div>
            </div>

            <button class="btn btn-primary" id="btnSave" style="width: 100%;">Guardar Juego en Base de Datos</button>
            <button class="btn btn-back" id="btnCancel" style="width: 100%; margin-top: 0.5rem; display: none;">Cancelar Edición</button>
        </div>

        <!-- Tabla -->
        <div class="table-section">
            <div style="padding: 1rem; border-bottom: 1px solid var(--border);">
                <input type="text" id="adminSearchInput" placeholder="🔍 Buscar juego por nombre..."
                    style="width: 100%; background: #09090b; border: 1px solid var(--border); color: white; padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.95rem;">
            </div>
            <table id="gamesTable">
                <thead>
                    <tr>
                        <th>Juego</th>
                        <th>Plataforma(s)</th>
                        <th>Precios Registrados</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dinamico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.querySelector('#gamesTable tbody');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const previewImg = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('previewContainer');
        const uploadText = document.getElementById('uploadText');
        const btnSave = document.getElementById('btnSave');
        const btnCancel = document.getElementById('btnCancel');
        const formTitle = document.getElementById('formTitle');
        const juegoIdInput = document.getElementById('juegoId');

        // All individual field IDs we save
        const allPriceFields = [
            'precio_codigo', 'precio_primaria', 'precio_secundaria', 'precio_alquiler', 'precio_eshop',
            'oferta_codigo', 'oferta_primaria', 'oferta_secundaria', 'oferta_alquiler',
            'precio_primaria_ps5', 'precio_primaria_ps4', 'precio_secundaria_ps5',
            'oferta_primaria_ps5', 'oferta_primaria_ps4', 'oferta_secundaria_ps5'
        ];
        const textFields = ['titulo', 'orden_destacado'];
        const PLATFORM_CHECKS = ['plat_ns', 'plat_ns2', 'plat_ps4', 'plat_ps5'];

        // --- Platform logic ---
        function getPlatformsSelected() {
            return PLATFORM_CHECKS
                .filter(id => document.getElementById(id).checked)
                .map(id => document.getElementById(id).value);
        }

        function isPlayStationSelected() {
            return document.getElementById('plat_ps4').checked || document.getElementById('plat_ps5').checked;
        }

        function isNintendoSelected() {
            return document.getElementById('plat_ns').checked || document.getElementById('plat_ns2').checked;
        }

        function updatePriceFieldsVisibility() {
            const showPS = isPlayStationSelected();
            const showNintendo = isNintendoSelected() || !showPS; // Default to Nintendo if nothing selected
            document.getElementById('priceFieldsNintendo').style.display = showNintendo ? 'grid' : 'none';
            document.getElementById('priceFieldsPS').style.display = showPS ? 'grid' : 'none';
            // Update label
            const label = document.getElementById('eshopLabel');
            if (showPS && !showNintendo) {
                label.textContent = 'PS Store (Ref.)';
            } else {
                label.textContent = 'eShop (Ref.)';
            }
        }

        PLATFORM_CHECKS.forEach(id => {
            document.getElementById(id).addEventListener('change', updatePriceFieldsVisibility);
        });

        // --- Discount apply ---
        window.applyDiscount = function () {
            const pctVal = parseFloat(document.getElementById('global_discount').value);
            if (isNaN(pctVal) || pctVal <= 0 || pctVal >= 100) {
                showToast("Ingresa un porcentaje de descuento válido (1-99)", true);
                return;
            }
            const mult = 1 - (pctVal / 100);
            const tiers = isPlayStationSelected()
                ? ['primaria_ps5', 'primaria_ps4', 'secundaria_ps5']
                : ['codigo', 'primaria', 'secundaria', 'alquiler'];
            tiers.forEach(tier => {
                const regInput = document.getElementById('precio_' + tier);
                const offInput = document.getElementById('oferta_' + tier);
                if (!regInput || !offInput) return;
                const regVal = parseFloat(regInput.value);
                if (!isNaN(regVal) && regVal > 0) {
                    offInput.value = Math.round(regVal * mult);
                }
            });
            showToast(`¡Descuento del ${pctVal}% aplicado!`);
        };

        function showToast(msg, isError = false) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast' + (isError ? ' error' : '');
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 300); }, 2500);
        }

        let allGames = [];

        // --- Fetch & Render ---
        async function loadGames() {
            try {
                const res = await fetch('/api/juegos');
                const data = await res.json();
                allGames = data.results || [];
                renderTable();
            } catch (err) { console.error(err); }
        }

        function formatPrice(val) {
            return val ? '$' + val.toLocaleString('es-AR') : '-';
        }

        function renderTable() {
            tableBody.innerHTML = '';
            const searchTerm = (document.getElementById('adminSearchInput')?.value || '').toLowerCase();
            const filtered = allGames.filter(g => g.titulo.toLowerCase().includes(searchTerm));
            filtered.forEach(game => {
                const tr = document.createElement('tr');
                const cover = game.imagen_filename ? `/uploads/${game.imagen_filename}` : 'https://via.placeholder.com/160x90?text=S/I';
                const platforms = game.plataforma || '';
                const isPS = platforms.includes('PS');
                const isSale = isPS
                    ? (game.precios.oferta_primaria_ps5 || game.precios.oferta_primaria_ps4 || game.precios.oferta_secundaria_ps5)
                    : (game.oferta_codigo || game.oferta_primaria || game.oferta_secundaria || game.oferta_alquiler);
                const starStyle = game.is_featured ? 'opacity:1; filter: none;' : 'opacity:0.3; filter: grayscale(1);';

                // Platform badges
                const platBadges = platforms.split(',').map(p => p.trim()).filter(Boolean)
                    .map(p => `<span style="background:${p.includes('PS') ? '#1e3a8a' : '#27272a'}; color:${p.includes('PS') ? '#93c5fd' : 'white'}; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 3px;">${p}</span>`)
                    .join('');

                // Prices display
                let pricesHtml = '';
                if (isPS) {
                    pricesHtml = `
                        <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.6;">
                            PS5-Pri: <span style="${game.precios.oferta_primaria_ps5 ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.precios.oferta_primaria_ps5 || game.precios.primaria_ps5)}</span> |
                            PS4-Pri: <span style="${game.precios.oferta_primaria_ps4 ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.precios.oferta_primaria_ps4 || game.precios.primaria_ps4)}</span><br>
                            PS5-Sec: <span style="${game.precios.oferta_secundaria_ps5 ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.precios.oferta_secundaria_ps5 || game.precios.secundaria_ps5)}</span>
                            ${game.precios.eshop ? `| <span style="color:#fca5a5; font-size:0.75rem;">PS Store: ${formatPrice(game.precios.eshop)}</span>` : ''}
                        </div>`;
                } else {
                    pricesHtml = `
                        <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">
                            Cód: <span style="${game.oferta_codigo ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.oferta_codigo || game.precio_codigo)}</span> |
                            Pri: <span style="${game.oferta_primaria ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.oferta_primaria || game.precio_primaria)}</span><br>
                            Sec: <span style="${game.oferta_secundaria ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.oferta_secundaria || game.precio_secundaria)}</span> |
                            Alq: <span style="${game.oferta_alquiler ? 'color:#eab308;font-weight:bold' : ''}">${formatPrice(game.oferta_alquiler || game.precio_alquiler)}</span><br>
                            eShop: <span style="color: #a1a1aa; font-style: italic;">${formatPrice(game.precio_eshop)}</span>
                        </div>`;
                }

                tr.innerHTML = `
                    <td>
                        <div class="game-cell">
                            <img src="${cover}" alt="${game.titulo}">
                            <strong>${game.is_featured ? '⭐ ' : ''}${isSale ? '🔥 ' : ''}${game.titulo}</strong>
                        </div>
                    </td>
                    <td>${platBadges || `<span style="background:#27272a; padding: 2px 6px; border-radius: 4px; font-size:0.75rem;">${platforms}</span>`}</td>
                    <td>${pricesHtml}</td>
                    <td>
                        <button class="action-btn" style="${starStyle}" onclick="toggleFeatured(${game.id})" title="Destacar">⭐</button>
                        <button class="action-btn" onclick="editGame(${game.id})">✏️</button>
                        <button class="action-btn" onclick="deleteGame(${game.id})">🗑️</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        document.getElementById('adminSearchInput').addEventListener('input', renderTable);

        // --- File Handling ---
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                    uploadText.innerText = "Imagen seleccionada: " + file.name;
                };
                reader.readAsDataURL(file);
            }
        };

        // --- CRUD Actions ---
        btnSave.onclick = async () => {
            const platforms = getPlatformsSelected();
            if (platforms.length === 0) {
                showToast('Selecciona al menos una plataforma', true);
                return;
            }
            document.getElementById('plataforma').value = platforms.join(',');

            const formData = new FormData();
            [...textFields, 'plataforma', ...allPriceFields].forEach(f => {
                const el = document.getElementById(f);
                if (el) formData.append(f, el.value);
            });
            formData.append('is_featured', document.getElementById('is_featured').checked ? '1' : '0');
            if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

            const id = juegoIdInput.value;
            const url = id ? `/api/admin/juegos/${id}` : '/api/admin/juegos';
            const method = id ? 'PUT' : 'POST';

            try {
                btnSave.disabled = true;
                btnSave.innerText = "Guardando...";
                const res = await fetch(url, { method, body: formData });
                const data = await res.json();
                if (data.status === 'ok') {
                    showToast('✅ Juego guardado correctamente');
                    resetForm();
                    loadGames();
                } else {
                    showToast('Error: ' + data.error, true);
                }
            } catch (err) {
                console.error(err);
                showToast('Fallo al guardar', true);
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Guardar Juego en Base de Datos";
            }
        };

        window.editGame = (id) => {
            const game = allGames.find(g => g.id === id);
            if (!game) return;

            juegoIdInput.value = game.id;
            textFields.forEach(f => { document.getElementById(f).value = game[f] || ''; });

            // Restore platform checkboxes
            const platforms = (game.plataforma || '').split(',').map(p => p.trim());
            PLATFORM_CHECKS.forEach(checkId => {
                const val = document.getElementById(checkId).value;
                document.getElementById(checkId).checked = platforms.includes(val);
            });
            updatePriceFieldsVisibility();

            // Restore price fields
            const priceMap = {
                precio_codigo: game.precio_codigo,
                precio_primaria: game.precio_primaria,
                precio_secundaria: game.precio_secundaria,
                precio_alquiler: game.precio_alquiler,
                precio_eshop: game.precio_eshop,
                oferta_codigo: game.oferta_codigo,
                oferta_primaria: game.oferta_primaria,
                oferta_secundaria: game.oferta_secundaria,
                oferta_alquiler: game.oferta_alquiler,
                precio_primaria_ps5: game.precio_primaria_ps5,
                precio_primaria_ps4: game.precio_primaria_ps4,
                precio_secundaria_ps5: game.precio_secundaria_ps5,
                oferta_primaria_ps5: game.oferta_primaria_ps5,
                oferta_primaria_ps4: game.oferta_primaria_ps4,
                oferta_secundaria_ps5: game.oferta_secundaria_ps5,
            };
            Object.entries(priceMap).forEach(([key, val]) => {
                const el = document.getElementById(key);
                if (el) el.value = val || '';
            });

            formTitle.innerText = "Editando: " + game.titulo;
            btnSave.innerText = "Actualizar Juego";
            btnCancel.style.display = 'block';
            document.getElementById('is_featured').checked = game.is_featured == 1;

            if (game.imagen_filename) {
                previewImg.src = `/uploads/${game.imagen_filename}`;
                previewContainer.style.display = 'block';
                uploadText.innerText = "Imagen actual: " + game.imagen_filename;
            } else {
                previewContainer.style.display = 'none';
                uploadText.innerText = "📁 Haz clic para subir imagen";
            }
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        };

        window.deleteGame = async (id) => {
            if (!confirm('¿Seguro que quieres eliminar este juego?')) return;
            try {
                const res = await fetch(`/api/admin/juegos/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'ok') loadGames();
            } catch (err) { console.error(err); }
        };

        btnCancel.onclick = resetForm;

        window.toggleFeatured = async (id) => {
            try {
                const res = await fetch(`/api/admin/juegos/${id}/toggle_featured`, { method: 'PATCH' });
                const data = await res.json();
                if (data.status === 'ok') {
                    const game = allGames.find(g => g.id === id);
                    if (game) game.is_featured = data.is_featured;
                    renderTable();
                    showToast(data.is_featured ? '⭐ Juego destacado' : 'Juego sin destacar');
                }
            } catch (err) { showToast('Error al cambiar destacado', true); }
        };

        function resetForm() {
            juegoIdInput.value = '';
            textFields.forEach(f => document.getElementById(f).value = '');
            allPriceFields.forEach(f => { const el = document.getElementById(f); if (el) el.value = ''; });
            PLATFORM_CHECKS.forEach(id => document.getElementById(id).checked = false);
            document.getElementById('plataforma').value = '';
            updatePriceFieldsVisibility();
            fileInput.value = '';
            previewContainer.style.display = 'none';
            uploadText.innerText = "📁 Haz clic para subir imagen";
            formTitle.innerText = "Agregar Nuevo Juego";
            btnSave.innerText = "Guardar Juego en Base de Datos";
            btnCancel.style.display = 'none';
            document.getElementById('is_featured').checked = false;
            document.getElementById('global_discount').value = '';
        }

        loadGames();
    </script>
</body>

</html>
