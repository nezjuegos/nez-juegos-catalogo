<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Juego | Nintendo Switch</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0a0a0c; --card:#131318; --primary:#8b5cf6; --secondary:#d946ef;
            --text:#f8fafc; --muted:#94a3b8; --border:#27272a; --yellow:#facc15;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:var(--bg);color:var(--text)}
        header{position:sticky;top:0;background:rgba(10,10,12,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:10}
        .logo{font-family:'Outfit';font-weight:800;font-size:1.35rem}
        .logo span{background:linear-gradient(to right,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
        .container{max-width:1100px;margin:0 auto;padding:1.5rem}
        
        .back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);text-decoration:none;margin-bottom:1.2rem;font-weight:500}
        .back:hover{color:#fff}
        
        .game-layout{display:grid;grid-template-columns:380px 1fr;gap:2rem;align-items:start}
        
        .cover-card{position:sticky;top:90px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px}
        .cover{width:100%;height:380px;object-fit:cover;border-radius:14px;border:1px solid var(--border);background:#111}
        
        .info-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.75rem}
        .title{font-family:'Outfit';font-size:2.1rem;line-height:1.15;margin-bottom:.75rem}
        
        .mode{border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:1rem;background:rgba(255,255,255,.015);transition:.2s}
        .mode:hover{border-color:rgba(139,92,246,.4)}
        .mode h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#c4b5fd;margin-bottom:.45rem}
        .price{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
        .old{color:var(--muted);text-decoration:line-through;font-size:.95rem}
        .new{font-family:'Outfit';font-weight:900;color:var(--yellow);font-size:1.55rem}
        .desc{font-size:.9rem;color:var(--muted);line-height:1.5}
        .warn{margin-top:.45rem;font-size:.78rem;color:#fca5a5;line-height:1.4}
        
        .cta-wrap{display:flex;justify-content:center;margin-top:1.25rem}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-width:230px;gap:.5rem;text-decoration:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:.8rem 1.8rem;border-radius:999px;font-weight:800;font-size:.95rem;box-shadow:0 4px 15px rgba(139,92,246,.3)}
        .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
        
        @media (max-width:900px){
            .game-layout{grid-template-columns:1fr;gap:1.5rem}
            .cover-card{position:static}
            .cover{height:260px}
            .title{font-size:1.65rem}
            .info-card{padding:1.35rem}
        }
    </style>
</head>
<body>
    <header><div class="logo">🎮 <span>Nez</span> Juegos</div></header>
    <main class="container">
        <a class="back" href="/nintendo-nuevo-preview">← Volver al catálogo</a>
        
        <div class="game-layout">
            <!-- Cover -->
            <div class="cover-card">
                <img id="cover" class="cover" alt="">
            </div>
            
            <!-- Info -->
            <div class="info-card">
                <h1 id="title" class="title">Cargando...</h1>
                <div id="modes"></div>
            </div>
        </div>
    </main>
    <script>
        const ars = (v) => v ? '$' + Number(v).toLocaleString('es-AR') : 'Consultar';
        const esc = (s) => String(s || '').replace(/[&<"]/g, m => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[m]));
        const priceLine = (reg, off) => {
            const same = Number(reg || 0) === Number(off || 0) || !reg;
            if (same) return `<span class="new">${ars(off)}</span>`;
            return `<span class="old">${ars(reg)}</span><span class="new">${ars(off)}</span>`;
        };
        const slug = decodeURIComponent((location.pathname.split('/').pop() || '').trim());
        async function load(){
            const r = await fetch(`/api/nintendo-mirror-item/${encodeURIComponent(slug)}`);
            const d = await r.json();
            if (!r.ok || !d.item) { document.getElementById('title').textContent = 'Juego no encontrado'; return; }
            const it = d.item;
            document.title = `${it.title} | Nintendo Switch`;
            document.getElementById('title').textContent = it.title || 'Juego';
            const cover = document.getElementById('cover');
            cover.src = it.image_url || '';
            cover.onerror = () => { cover.style.display = 'none'; };
            const modes = document.getElementById('modes');
            modes.innerHTML = `
                <section class="mode">
                    <h3>${esc(it.primaria.label)}</h3>
                    <div class="price">${priceLine(it.primaria.regular_price_ars, it.primaria.offer_price_ars)}</div>
                    <p class="desc">${esc(it.primaria.description)}</p>
                </section>
                <section class="mode">
                    <h3>${esc(it.codigo.label)}</h3>
                    <div class="price">${priceLine(it.codigo.regular_price_ars, it.codigo.offer_price_ars)}</div>
                    <p class="desc">${esc(it.codigo.description)}</p>
                    <p class="warn">${esc(it.codigo.disclaimer)}</p>
                </section>
                <div class="cta-wrap">
                    <a class="btn" href="/nintendo-nuevo-checkout?game=${encodeURIComponent(it.slug)}">Comprar</a>
                </div>
            `;
        }
        load().catch(() => { document.getElementById('title').textContent = 'Error cargando juego'; });
    </script>
</body>
</html>
