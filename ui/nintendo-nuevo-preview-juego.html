<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Juego | Nintendo Switch</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0a0c;--card:#131318;--primary:#8b5cf6;--secondary:#d946ef;--text:#f8fafc;--muted:#94a3b8;--border:#27272a;--ok:#22c55e}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:var(--bg);color:var(--text)}
        header{position:sticky;top:0;background:rgba(10,10,12,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 1.25rem;z-index:10}
        .logo{font-family:'Outfit';font-weight:800;font-size:1.35rem}
        .logo span{background:linear-gradient(to right,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
        .container{max-width:1050px;margin:0 auto;padding:1.2rem}
        .grid{display:grid;grid-template-columns:320px 1fr;gap:1rem}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem}
        .cover{width:100%;height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#111}
        .title{font-family:'Outfit';font-size:1.7rem;line-height:1.2;margin-bottom:.6rem}
        .mode{border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:.65rem;background:rgba(255,255,255,.02)}
        .mode h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:#ddd6fe;margin-bottom:.25rem}
        .price{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.35rem}
        .old{color:var(--muted);text-decoration:line-through}
        .new{font-family:'Outfit';font-weight:900;color:var(--ok);font-size:1.25rem}
        .desc{font-size:.86rem;color:var(--muted);line-height:1.45}
        .warn{margin-top:.35rem;font-size:.78rem;color:#fca5a5}
        .back{display:inline-block;margin-bottom:.75rem;color:var(--muted);text-decoration:none}
        @media (max-width:820px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <header><div class="logo">🎮 <span>Nez</span> Juegos</div></header>
    <main class="container">
        <a class="back" href="/nintendo-nuevo-preview">← Volver al catálogo</a>
        <div class="grid">
            <div class="card"><img id="cover" class="cover" alt=""></div>
            <div class="card">
                <h1 id="title" class="title">Cargando...</h1>
                <div id="modes"></div>
            </div>
        </div>
    </main>
    <script>
        const ars = (v) => v ? '$' + Number(v).toLocaleString('es-AR') : 'Consultar';
        const esc = (s) => String(s || '').replace(/[&<"]/g, m => ({'&':'&amp;','<':'&lt;','"':'&quot;'}[m]));
        const slug = decodeURIComponent((location.pathname.split('/').pop() || '').trim());
        async function load(){
            const r = await fetch(`/api/nintendo-mirror-item/${encodeURIComponent(slug)}`);
            const d = await r.json();
            if (!r.ok || !d.item) { document.getElementById('title').textContent = 'Juego no encontrado'; return; }
            const it = d.item;
            document.title = `${it.title} | Nintendo Switch`;
            document.getElementById('title').textContent = it.title || 'Juego';
            const cover = document.getElementById('cover');
            cover.src = it.image_url || '';
            cover.onerror = () => { cover.style.display = 'none'; };
            const modes = document.getElementById('modes');
            modes.innerHTML = `
                <section class="mode">
                    <h3>${esc(it.codigo.label)}</h3>
                    <div class="price"><span class="old">${ars(it.codigo.regular_price_ars)}</span><span class="new">${ars(it.codigo.offer_price_ars)}</span></div>
                    <p class="desc">${esc(it.codigo.description)}</p>
                    <p class="warn">${esc(it.codigo.disclaimer)}</p>
                </section>
                <section class="mode">
                    <h3>${esc(it.primaria.label)}</h3>
                    <div class="price"><span class="old">${ars(it.primaria.regular_price_ars)}</span><span class="new">${ars(it.primaria.offer_price_ars)}</span></div>
                    <p class="desc">${esc(it.primaria.description)}</p>
                </section>
            `;
        }
        load().catch(() => { document.getElementById('title').textContent = 'Error cargando juego'; });
    </script>
</body>
</html>
